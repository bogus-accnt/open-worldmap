<!DOCTYPE html>

<!-- Copyright (c) 2026 open-worldmap contributors - https://github.com/bogus-accnt/open-worldmap -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>worldmap-module — demo</title>
<style>
  :root {
    --page-bg: #f5f7fa;
    --page-fg: #1b1f24;
    --page-muted: #6b7280;
    --page-card: #ffffff;
    --page-border: #e3e6ea;
    --page-accent: #2f6fd0;
  }
  html[data-theme="dark"] {
    --page-bg: #0d1014;
    --page-fg: #e8eaed;
    --page-muted: #9aa3ad;
    --page-card: #14181d;
    --page-border: #262c34;
    --page-accent: #4f8fe6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .2s ease, color .2s ease;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--page-muted); font-size: 13px; }
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 14px; padding: 10px 12px;
    background: var(--page-card); border: 1px solid var(--page-border); border-radius: 10px;
  }
  .controls label { font-size: 12px; color: var(--page-muted); display: flex; align-items: center; gap: 6px; }
  select, button {
    font: inherit; font-size: 13px; color: inherit;
    background: var(--page-card); border: 1px solid var(--page-border);
    border-radius: 6px; padding: 6px 9px; cursor: pointer;
  }
  button.primary { background: var(--page-accent); color: #fff; border-color: transparent; }
  .spacer { flex: 1 1 auto; }
  #selection { font-size: 12px; color: var(--page-muted); font-variant-numeric: tabular-nums; }
  #map { height: 640px; }
  section.records { margin-top: 22px; }
  section.records h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  #record-count { font-size: 12px; color: var(--page-muted); font-weight: 400; }
  .table-scroll { max-height: 320px; overflow: auto; border: 1px solid var(--page-border); border-radius: 10px; background: var(--page-card); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--page-border); }
  th { position: sticky; top: 0; background: var(--page-card); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); z-index: 1; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--page-accent) 8%, transparent); }
  td.code { font-family: ui-monospace, Consolas, monospace; color: var(--page-muted); }
  td.json { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--page-muted); max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-del { border: none; background: none; color: var(--page-muted); font-size: 13px; padding: 2px 6px; }
  .row-del:hover { color: #d1443f; }
  pre {
    margin-top: 22px; padding: 14px 16px; overflow: auto;
    background: var(--page-card); border: 1px solid var(--page-border); border-radius: 10px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.55;
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    background: #1b1f24; color: #fff; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #toast.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>worldmap-module</h1>
    <p>Organize any JSON data by country — click a country to view and edit its record.
       Edits are stored in your browser; “Reset demo data” restores the samples.</p>
  </header>

  <div class="controls">
    <label>Dataset
      <select id="dataset">
        <option value="population">Population (2023)</option>
        <option value="status">Rollout status (categorical)</option>
        <option value="revenue">Revenue (linear)</option>
      </select>
    </label>
    <label>Scale
      <select id="scale-mode">
        <option value="auto">auto</option>
        <option value="quantile">quantile</option>
        <option value="linear">linear</option>
        <option value="categorical">categorical</option>
      </select>
    </label>
    <label><input type="checkbox" id="theme" /> Dark theme</label>
    <button id="reset" class="primary">Reset demo data</button>
    <span class="spacer"></span>
    <span id="selection">Nothing selected</span>
  </div>

  <div id="map"></div>

  <section class="records">
    <h2>Stored records <span id="record-count"></span></h2>
    <div class="table-scroll">
      <table id="records">
        <thead>
          <tr><th>Code</th><th>Country</th><th>Record</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <pre id="snippet"></pre>
</div>

<div id="toast"></div>

<script type="module" src="./demo.js"></script>
<script>
  document.getElementById("snippet").textContent =
`import { WorldMapModule, CountryStore, localStorageAdapter } from "./src/index.js";

const store = new CountryStore({ storage: localStorageAdapter() });
store.set("DE", { population: 83294633, status: "active" });   // any JSON

const map = new WorldMapModule({
  el: "#map",
  store,
  colorBy: "population",     // or (record, code) => record?.revenue
  colors: "blues",           // "blues" | "greens" | "warm" | "categorical" | [hex…]
  scaleMode: "quantile",     // "auto" | "quantile" | "linear" | "categorical"
  valueLabel: "People",
  title: "World Data Explorer",
});`;
</script>
</body>
</html>
